name: 202608310121 hourly audit watchdog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310121-hourly-audit-watchdog.yml
      - automation/202608310121-hourly-watchdog/**
  workflow_dispatch:
  schedule:
    - cron: '43 0-7 31 8 *'

permissions:
  actions: write
  contents: write

concurrency:
  group: 202608310121-hourly-audit-watchdog
  cancel-in-progress: false

jobs:
  supervise:
    if: github.repository == 'Ventusltd/chatgpt-audits'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONTROLLER: automation/202608310121-hourly-watchdog/watchdog.py
      WATCHDOG_BRANCH: audit/hourly-watchdog-20260831
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact current audit main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Enforce the one-night timer window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW=$(TZ=Europe/London date +%Y%m%d%H%M)
          if [[ "$NOW" > "202608310059" && "$NOW" < "202608310901" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Outside the bounded overnight watchdog window; inert by design."
          fi

      - name: Validate watchdog controller
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m py_compile "$CONTROLLER"
          rm -rf automation/202608310121-hourly-watchdog/__pycache__

      - name: Inspect timers, failed actions and bounded repairs
        id: inspect
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          STAMP=$(TZ=Europe/London date +%Y%m%d%H%M)
          TEMP_OUTPUT="$RUNNER_TEMP/202608310121-watchdog-${GITHUB_RUN_ID}"
          TARGET_PATH="202608310033-study/WATCHDOG/${STAMP}-run-${GITHUB_RUN_ID}"
          rm -rf "$TEMP_OUTPUT"
          mkdir -p "$TEMP_OUTPUT"
          python3 "$CONTROLLER" \
            --output "$TEMP_OUTPUT" \
            --hours-back 12 \
            --max-reruns 3
          {
            echo "stamp=$STAMP"
            echo "temp_output=$TEMP_OUTPUT"
            echo "target_path=$TARGET_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Commit only the hourly watchdog record
        if: steps.guard.outputs.active == 'true'
        env:
          STAMP: ${{ steps.inspect.outputs.stamp }}
          TEMP_OUTPUT: ${{ steps.inspect.outputs.temp_output }}
          TARGET_PATH: ${{ steps.inspect.outputs.target_path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-audits-hourly-watchdog"
          git config user.email "actions@users.noreply.github.com"
          git fetch --force origin "+refs/heads/${WATCHDOG_BRANCH}:refs/remotes/origin/${WATCHDOG_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${WATCHDOG_BRANCH}"; then
            git switch -C "$WATCHDOG_BRANCH" "origin/$WATCHDOG_BRANCH"
          else
            git switch -c "$WATCHDOG_BRANCH"
          fi
          mkdir -p "$TARGET_PATH"
          cp -a "$TEMP_OUTPUT"/. "$TARGET_PATH"/
          git add -- "$TARGET_PATH"
          ESCAPED=$(git diff --cached --name-only | grep -v "^${TARGET_PATH}/" || true)
          if [ -n "$ESCAPED" ]; then
            echo "Staged path escaped the watchdog quarantine:" >&2
            echo "$ESCAPED" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No new watchdog evidence to commit."
            exit 0
          fi
          git commit -m "${STAMP}-audit: UNREVIEWED hourly Actions watchdog"
          git push origin "HEAD:${WATCHDOG_BRANCH}"

      - name: Publish hourly operator summary
        if: always() && steps.guard.outputs.active == 'true'
        env:
          TEMP_OUTPUT: ${{ steps.inspect.outputs.temp_output }}
          TARGET_PATH: ${{ steps.inspect.outputs.target_path }}
        shell: bash
        run: |
          {
            echo "# Hourly audit watchdog"
            echo
            echo "- Review status: **UNREVIEWED**"
            echo "- Persistent branch: \`${WATCHDOG_BRANCH}\`"
            echo "- Output: \`${TARGET_PATH:-not-created}\`"
            echo "- Automatic audit re-run ceiling: attempt 3"
            echo "- Product repository actions: **read-only**"
            echo
            if [ -f "${TEMP_OUTPUT:-}/WATCHDOG.md" ]; then
              cat "$TEMP_OUTPUT/WATCHDOG.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
