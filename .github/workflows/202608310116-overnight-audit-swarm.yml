name: 202608310116 overnight audit swarm

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310116-overnight-audit-swarm.yml
      - automation/202608310116-overnight-swarm/**
      - 202608310033-study/HANDOFFS/**
  workflow_dispatch:
  schedule:
    - cron: '20 0-6 31 8 *'

permissions:
  contents: write
  actions: read

concurrency:
  group: 202608310116-overnight-audit-swarm
  cancel-in-progress: false

env:
  SOURCE_PROGRAMME_DIR: automation/202608310116-overnight-swarm
  PROGRAMME_DIR: work/controller
  PLAN: automation/202608310116-overnight-swarm/swarm-plan.json
  ASSEMBLER: automation/202608310116-overnight-swarm/assemble_controller.py
  CONTROLLER_MANIFEST: automation/202608310116-overnight-swarm/controller-manifest.json
  PAYLOAD_DIR: automation/202608310116-overnight-swarm/payload
  PYTHONDONTWRITEBYTECODE: '1'
  GIT_TERMINAL_PROMPT: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      active: ${{ steps.guard.outputs.active }}
      lanes: ${{ steps.matrix.outputs.lanes }}
    steps:
      - name: Checkout audit controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce the one-night schedule window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOW=$(TZ=Europe/London date +%Y%m%d%H%M)
          if [[ "$NOW" > "202608310059" && "$NOW" < "202608310801" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Schedule outside 2026-08-31 01:00–08:00 Europe/London; inert by design."
          fi

      - name: Assemble hash-verified controller
        if: steps.guard.outputs.active == 'true'
        run: python3 "$ASSEMBLER" --payload-dir "$PAYLOAD_DIR" --manifest "$CONTROLLER_MANIFEST" --output "$PROGRAMME_DIR"

      - name: Validate controller and build lane matrix
        id: matrix
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "$PROGRAMME_DIR/common.py" \
            "$PROGRAMME_DIR/prepare.py" \
            "$PROGRAMME_DIR/run_lane.py" \
            "$PROGRAMME_DIR/aggregate.py" \
            "$PROGRAMME_DIR/verify.py"
          python3 -m json.tool "$PLAN" >/dev/null
          LANES=$(python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('automation/202608310116-overnight-swarm/swarm-plan.json').read_text())
          assert plan['review_status'] == 'UNREVIEWED'
          assert plan['source_policy']['product_repo_writes'] == 'FORBIDDEN'
          assert plan['source_policy']['product_workflow_dispatches'] == 'FORBIDDEN'
          assert len(plan['lanes']) == 12
          print(json.dumps([row['id'] for row in plan['lanes']], separators=(',', ':')))
          PY
          )
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"

      - name: Resolve one exact source manifest for every parallel lane
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/manifest
          PYTHONPATH="$PROGRAMME_DIR" python3 "$PROGRAMME_DIR/prepare.py" \
            --plan "$PLAN" \
            --output work/manifest/SOURCE-SNAPSHOT.json

      - name: Upload exact source manifest
        if: steps.guard.outputs.active == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swarm-source-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/manifest/SOURCE-SNAPSHOT.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

  lanes:
    name: lane · ${{ matrix.lane }}
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        lane: ${{ fromJSON(needs.prepare.outputs.lanes) }}
    steps:
      - name: Checkout exact audit controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Assemble hash-verified controller
        run: python3 "$ASSEMBLER" --payload-dir "$PAYLOAD_DIR" --manifest "$CONTROLLER_MANIFEST" --output "$PROGRAMME_DIR"

      - name: Download shared source manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swarm-source-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/manifest

      - name: Execute source-pinned specialist lane
        id: execute
        shell: bash
        run: |
          set +e
          mkdir -p work/lane-output work/source-snapshots
          PYTHONPATH="$PROGRAMME_DIR" python3 "$PROGRAMME_DIR/run_lane.py" \
            --plan "$PLAN" \
            --manifest work/manifest/SOURCE-SNAPSHOT.json \
            --lane "${{ matrix.lane }}" \
            --output "work/lane-output/${{ matrix.lane }}" \
            --source-root "work/source-snapshots/${{ matrix.lane }}" \
            --audit-root "$GITHUB_WORKSPACE"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prove no product snapshot was staged or retained
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "work/lane-output/${{ matrix.lane }}/LANE.json"
          ! find "work/lane-output/${{ matrix.lane }}" -type d -name .git -print -quit | grep -q .
          ! find "work/lane-output/${{ matrix.lane }}" -type f \( -name '*.parquet' -o -name '*.duckdb' -o -name '*.pyc' \) -print -quit | grep -q .

      - name: Upload specialist evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: swarm-lane-${{ matrix.lane }}
          path: work/lane-output/${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - name: Mark an incomplete specialist lane red after preserving evidence
        if: steps.execute.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Lane ${{ matrix.lane }} retained its quarantine evidence but exited ${{ steps.execute.outputs.exit_code }}" >&2
          exit 1

  aggregate:
    needs:
      - prepare
      - lanes
    if: always() && needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout main as the immutable aggregation parent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Assemble hash-verified controller
        run: python3 "$ASSEMBLER" --payload-dir "$PAYLOAD_DIR" --manifest "$CONTROLLER_MANIFEST" --output "$PROGRAMME_DIR"

      - name: Download exact source manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swarm-source-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/manifest

      - name: Download every available specialist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: swarm-lane-*
          path: work/lanes
          merge-multiple: false

      - name: Create run-specific quarantine branch and output path
        shell: bash
        run: |
          set -euo pipefail
          STAMP=$(TZ=Europe/London date +%Y%m%d%H%M)
          BRANCH="audit/${STAMP}-overnight-swarm-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          OUTPUT_ROOT="202608310033-study/AUTOMATION-RUNS/${STAMP}-overnight-swarm-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          {
            echo "RUN_STAMP=$STAMP"
            echo "QUARANTINE_BRANCH=$BRANCH"
            echo "OUTPUT_ROOT=$OUTPUT_ROOT"
          } >> "$GITHUB_ENV"
          git config user.name "chatgpt-audits-overnight-swarm"
          git config user.email "actions@users.noreply.github.com"
          git switch -c "$BRANCH"

      - name: Aggregate findings and build PipelineNews vNext quarantine candidate
        id: synthesis
        shell: bash
        run: |
          set +e
          PYTHONPATH="$PROGRAMME_DIR" python3 "$PROGRAMME_DIR/aggregate.py" \
            --plan "$PLAN" \
            --manifest work/manifest/SOURCE-SNAPSHOT.json \
            --lanes-root work/lanes \
            --output "$OUTPUT_ROOT"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run fail-closed quarantine, schema and adversarial gates
        id: verify
        shell: bash
        run: |
          set +e
          PYTHONPATH="$PROGRAMME_DIR" python3 "$PROGRAMME_DIR/verify.py" \
            --plan "$PLAN" \
            --manifest work/manifest/SOURCE-SNAPSHOT.json \
            --output "$OUTPUT_ROOT" \
            --report "$OUTPUT_ROOT/VERIFICATION.json"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only the timestamped audit output to its quarantine branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          find "$OUTPUT_ROOT" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$OUTPUT_ROOT" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -- "$OUTPUT_ROOT"
          ESCAPED=$(git diff --cached --name-only | grep -v "^${OUTPUT_ROOT}/" || true)
          if [ -n "$ESCAPED" ]; then
            echo "Staged path escaped quarantine:" >&2
            echo "$ESCAPED" >&2
            exit 1
          fi
          git commit -m "${RUN_STAMP}-audit: UNREVIEWED overnight parallel synthesis"
          git push --set-upstream origin HEAD:"$QUARANTINE_BRANCH"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload complete overnight synthesis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: overnight-swarm-synthesis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_ROOT }}
          if-no-files-found: warn
          retention-days: 90
          compression-level: 9

      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Overnight parallel audit swarm"
            echo
            echo "- Review status: **UNREVIEWED**"
            echo "- Quarantine branch: \`${QUARANTINE_BRANCH:-not-created}\`"
            echo "- Output root: \`${OUTPUT_ROOT:-not-created}\`"
            echo "- PipelineNews intelligence lanes: collectors, identity, timing and adversarial invariants"
            echo "- Company binding lane: collision, historical-spine closure and nested REPD decoy"
            echo "- GridAtlas lane: producer/consumer route and sentinel contract matrix"
            echo "- Product repository writes or dispatches: **none**"
            echo "- Aggregation exit: ${{ steps.synthesis.outputs.exit_code }}"
            echo "- Verification exit: ${{ steps.verify.outputs.exit_code }}"
            echo "- Quarantine commit: \`${{ steps.commit.outputs.commit_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed evidence but mark incomplete synthesis red
        if: steps.synthesis.outputs.exit_code != '0' || steps.verify.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "The quarantined branch and artifact were preserved, but one or more required gates failed." >&2
          exit 1
