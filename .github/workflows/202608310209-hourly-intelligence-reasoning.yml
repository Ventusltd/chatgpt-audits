name: 202608310209 hourly intelligence reasoning checkpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310209-hourly-intelligence-reasoning.yml
      - automation/202608310209-hourly-logic-review/**
  workflow_dispatch:
  schedule:
    - cron: '12 2-5 31 8 *'

permissions:
  actions: read
  contents: write

concurrency:
  group: 202608310209-hourly-intelligence-reasoning
  cancel-in-progress: false

jobs:
  review:
    if: github.repository == 'Ventusltd/chatgpt-audits'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CONTROLLER: automation/202608310209-hourly-logic-review/review.py
      CANDIDATE_ROOT: automation/202608310209-hourly-logic-review/candidates
      LOGIC_BRANCH: audit/202608310209-hourly-logic-review
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Checkout exact current audit main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Enforce the bounded five-run window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(TZ=Europe/London date +%Y%m%d%H%M)
          ACTIVE=false
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch)
              if [[ "$NOW" > "202608310159" && "$NOW" < "202608310631" ]]; then
                ACTIVE=true
              fi
              ;;
            schedule)
              if [[ "$NOW" > "202608310259" && "$NOW" < "202608310631" ]]; then
                ACTIVE=true
              fi
              ;;
          esac
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "checked_london=$NOW" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" != "true" ]; then
            echo "Outside the bounded five-run logic window; inert by design."
          fi

      - name: Validate controller and five quarantined candidates
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CONTROLLER"
          test "$(find "$CANDIDATE_ROOT" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 5
          python3 -m py_compile "$CONTROLLER" "$CANDIDATE_ROOT"/*.py
          find automation/202608310209-hourly-logic-review -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Build the hourly evidence, good/bad review and next candidate
        id: reason
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -u
          STAMP=$(TZ=Europe/London date +%Y%m%d%H%M)
          TEMP_OUTPUT="$RUNNER_TEMP/202608310209-logic-${GITHUB_RUN_ID}"
          TARGET_PATH="202608310033-study/LOGIC-TIMER/${STAMP}-run-${GITHUB_RUN_ID}"
          rm -rf "$TEMP_OUTPUT"
          mkdir -p "$TEMP_OUTPUT"

          set +e
          python3 "$CONTROLLER" \
            --output "$TEMP_OUTPUT" \
            --candidate-root "$CANDIDATE_ROOT" \
            --lookback-minutes 90 \
            >"$RUNNER_TEMP/202608310209-logic-result.json"
          CODE=$?
          set -e

          if [ "$CODE" -eq 3 ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/202608310209-logic-result.json"
            exit 0
          fi
          if [ "$CODE" -ne 0 ]; then
            cat "$RUNNER_TEMP/202608310209-logic-result.json" >&2 || true
            exit "$CODE"
          fi

          SEQUENCE=$(python3 -c "import json; print(json.load(open('$TEMP_OUTPUT/REVIEW.json'))['sequence'])")
          CANDIDATE=$(python3 -c "import json; print(json.load(open('$TEMP_OUTPUT/REVIEW.json'))['new_candidate']['filename'])")
          {
            echo "created=true"
            echo "complete=false"
            echo "stamp=$STAMP"
            echo "temp_output=$TEMP_OUTPUT"
            echo "target_path=$TARGET_PATH"
            echo "sequence=$SEQUENCE"
            echo "candidate=$CANDIDATE"
          } >> "$GITHUB_OUTPUT"

      - name: Commit only the timestamped logic review
        if: steps.reason.outputs.created == 'true'
        env:
          STAMP: ${{ steps.reason.outputs.stamp }}
          TEMP_OUTPUT: ${{ steps.reason.outputs.temp_output }}
          TARGET_PATH: ${{ steps.reason.outputs.target_path }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-audits-hourly-logic"
          git config user.email "actions@users.noreply.github.com"
          git fetch --force origin "+refs/heads/${LOGIC_BRANCH}:refs/remotes/origin/${LOGIC_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${LOGIC_BRANCH}"; then
            git switch -C "$LOGIC_BRANCH" "origin/$LOGIC_BRANCH"
          else
            git switch -c "$LOGIC_BRANCH"
          fi

          mkdir -p "$TARGET_PATH"
          cp -a "$TEMP_OUTPUT"/. "$TARGET_PATH"/
          git add -- "$TARGET_PATH"

          ESCAPED=$(git diff --cached --name-only | grep -v "^${TARGET_PATH}/" || true)
          if [ -n "$ESCAPED" ]; then
            echo "Staged path escaped the logic-review quarantine:" >&2
            echo "$ESCAPED" >&2
            exit 1
          fi

          git commit -m "${STAMP}-audit: UNREVIEWED hourly intelligence review ${{ steps.reason.outputs.sequence }}/5"
          git push origin "HEAD:${LOGIC_BRANCH}"

      - name: Upload logic-review packet
        if: always() && steps.reason.outputs.created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hourly-logic-${{ github.run_id }}-${{ steps.reason.outputs.sequence }}
          path: ${{ steps.reason.outputs.temp_output }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Hourly intelligence reasoning checkpoint"
            echo
            echo "- Active window: ${{ steps.guard.outputs.active || 'false' }}"
            echo "- London check: ${{ steps.guard.outputs.checked_london || 'not-run' }}"
            echo "- Review created: ${{ steps.reason.outputs.created || 'false' }}"
            echo "- Five-run sequence: ${{ steps.reason.outputs.sequence || 'complete/not-run' }}"
            echo "- New candidate: \`${{ steps.reason.outputs.candidate || 'none' }}\`"
            echo "- Persistent branch: \`${LOGIC_BRANCH}\`"
            echo "- Product writes or dispatches: **none**"
            echo "- ChatGPT model invoked by this workflow: **no**"
            echo
            if [ -f "${{ steps.reason.outputs.temp_output }}/REVIEW.md" ]; then
              cat "${{ steps.reason.outputs.temp_output }}/REVIEW.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
