name: 202608310322 real GPT hourly architecture reviewer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310322-real-gpt-hourly-review.yml
      - automation/202608310322-gpt-reasoning-timer/**
  workflow_dispatch:
  schedule:
    - cron: '34 3-6 31 8 *'

permissions:
  actions: read
  contents: write
  copilot-requests: write

concurrency:
  group: 202608310322-real-gpt-hourly-architecture-reviewer
  cancel-in-progress: false

env:
  CONTROLLER_ROOT: automation/202608310322-gpt-reasoning-timer
  BUILD_PROMPT: automation/202608310322-gpt-reasoning-timer/build_prompt.py
  RENDER_RESPONSE: automation/202608310322-gpt-reasoning-timer/render_response.py
  RESPONSE_SCHEMA: automation/202608310322-gpt-reasoning-timer/response-schema.json
  SYSTEM_PROMPT: automation/202608310322-gpt-reasoning-timer/copilot-system.txt
  RUNTIME_SOURCE: automation/202608310322-gpt-reasoning-timer/copilot-runtime-source.json
  MODEL_ID: gpt-5
  MODEL_PROVIDER: github-copilot-cli
  COPILOT_CLI_VERSION: 1.0.82
  MODEL_BRANCH: audit/202608310322-real-gpt-hourly-review
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reason:
    if: github.repository == 'Ventusltd/chatgpt-audits'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact current audit main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Enforce the bounded five-hour model window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(TZ=Europe/London date +%Y%m%d%H%M)
          ACTIVE=false
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch)
              if [[ "$NOW" > "202608310319" && "$NOW" < "202608310801" ]]; then
                ACTIVE=true
              fi
              ;;
            schedule)
              if [[ "$NOW" > "202608310419" && "$NOW" < "202608310801" ]]; then
                ACTIVE=true
              fi
              ;;
          esac
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "checked_london=$NOW" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" != "true" ]; then
            echo "Outside the bounded five-run model-review window; inert by design."
          fi

      - name: Validate controller, response contract and runtime source card
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f "$BUILD_PROMPT"
          test -f "$RENDER_RESPONSE"
          test -f "$RESPONSE_SCHEMA"
          test -f "$SYSTEM_PROMPT"
          test -f "$RUNTIME_SOURCE"
          python3 -m py_compile "$BUILD_PROMPT" "$RENDER_RESPONSE"
          find "$CONTROLLER_ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema = json.loads(Path("automation/202608310322-gpt-reasoning-timer/response-schema.json").read_text())
          assert schema["type"] == "object"
          assert schema["additionalProperties"] is False
          assert set(schema["required"]) == {
              "overall_assessment", "what_happened", "good", "bad",
              "recommended_improvement", "deterministic_tests",
              "do_not_change", "uncertainties"
          }

          source = json.loads(Path("automation/202608310322-gpt-reasoning-timer/copilot-runtime-source.json").read_text())
          assert source["version"] == "1.0.82"
          assert source["platform"] == "linux-x64"
          assert source["sha256"] == "37fa67686a9e4ed8d46dcd6a9c80ab524dea840ecaa0a3f7edf8d09f961b97a9"
          assert source["network_classification"] == "SUPERVISED_SOURCE_CARDED_RUNTIME_FETCH"
          PY

          TEST_ROOT="$RUNNER_TEMP/202608310322-renderer-self-test"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          cat > "$TEST_ROOT/response.json" <<'JSON'
          {
            "overall_assessment": "Synthetic renderer self-test.",
            "what_happened": [{"claim":"A test ran.","evidence":"Synthetic fixture.","classification":"observed"}],
            "good": [{"claim":"The fixture is bounded.","evidence":"Local temporary files only.","classification":"observed"}],
            "bad": [{"issue":"This is not production evidence.","evidence":"The payload is synthetic.","classification":"observed","impact":"It cannot support a product claim."}],
            "recommended_improvement": {
              "kind":"python",
              "name":"synthetic_test.py",
              "purpose":"Exercise the renderer.",
              "evidence_basis":"Local fixture.",
              "algorithm":"Parse and validate strict fields.",
              "inputs":["Synthetic JSON"],
              "outputs":["Rendered Markdown"],
              "rejection_conditions":["Missing required field"]
            },
            "deterministic_tests": [
              {"name":"parse","fixture":"Valid JSON","assertion":"Exit zero"},
              {"name":"schema","fixture":"Missing key","assertion":"Reject"},
              {"name":"boundary","fixture":"Temporary output","assertion":"No product path"}
            ],
            "do_not_change":["Product repositories"],
            "uncertainties":["None relevant to this synthetic fixture"]
          }
          JSON
          printf 'synthetic prompt\n' > "$TEST_ROOT/prompt.txt"
          python3 "$RENDER_RESPONSE" \
            --response "$TEST_ROOT/response.json" \
            --prompt "$TEST_ROOT/prompt.txt" \
            --output "$TEST_ROOT/rendered" \
            --sequence 1 \
            --model "$MODEL_ID" \
            --provider "$MODEL_PROVIDER" \
            --runtime "copilot-cli/${COPILOT_CLI_VERSION}"
          test -s "$TEST_ROOT/rendered/MODEL-REVIEW.md"
          test -s "$TEST_ROOT/rendered/MODEL-REVIEW.json"

      - name: Install pinned Copilot CLI from its source-carded GitHub release
        id: runtime
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/copilot-cli-${COPILOT_CLI_VERSION}"
          ARCHIVE="$RUNNER_TEMP/copilot-linux-x64-${COPILOT_CLI_VERSION}.tar.gz"
          URL=$(python3 -c "import json; print(json.load(open('$RUNTIME_SOURCE'))['asset_url'])")
          EXPECTED=$(python3 -c "import json; print(json.load(open('$RUNTIME_SOURCE'))['sha256'])")
          rm -rf "$RUNTIME_ROOT" "$ARCHIVE"
          mkdir -p "$RUNTIME_ROOT"
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$URL" --output "$ARCHIVE"
          echo "$EXPECTED  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNTIME_ROOT"
          COPILOT_PATH=$(find "$RUNTIME_ROOT" -type f -name copilot -print -quit)
          test -n "$COPILOT_PATH"
          chmod 0555 "$COPILOT_PATH"
          ACTUAL_VERSION=$($COPILOT_PATH --version | head -n 1 | tr -d '\r')
          echo "Pinned runtime reports: $ACTUAL_VERSION"
          {
            echo "path=$COPILOT_PATH"
            echo "version=$ACTUAL_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Allocate one of exactly five persistent review slots
        id: allocate
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/heads/${MODEL_BRANCH}:refs/remotes/origin/${MODEL_BRANCH}" || true
          COUNT=0
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            COUNT=$(git ls-tree -r --name-only "origin/${MODEL_BRANCH}" \
              | grep -c '/MODEL-REVIEW.json$' || true)
          fi
          if [ "$COUNT" -ge 5 ]; then
            echo "attempt=false" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "sequence=5" >> "$GITHUB_OUTPUT"
            echo "Five validated GPT reviews already exist; no sixth model call will be made."
            exit 0
          fi

          SEQUENCE=$((COUNT + 1))
          STAMP=$(TZ=Europe/London date +%Y%m%d%H%M)
          TEMP_OUTPUT="$RUNNER_TEMP/202608310322-real-gpt-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-s${SEQUENCE}"
          TARGET_PATH="202608310033-study/REAL-GPT-TIMER/${STAMP}-run-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-review-${SEQUENCE}"
          rm -rf "$TEMP_OUTPUT"
          mkdir -p "$TEMP_OUTPUT"
          {
            echo "attempt=true"
            echo "complete=false"
            echo "sequence=$SEQUENCE"
            echo "stamp=$STAMP"
            echo "temp_output=$TEMP_OUTPUT"
            echo "target_path=$TARGET_PATH"
          } >> "$GITHUB_OUTPUT"

      - name: Build current evidence and a non-executable model prompt
        if: steps.allocate.outputs.attempt == 'true'
        env:
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILD_PROMPT" \
            --sequence "$SEQUENCE" \
            --output "$TEMP_OUTPUT"
          test -s "$TEMP_OUTPUT/EVIDENCE.json"
          test -s "$TEMP_OUTPUT/EVIDENCE-PACKET.md"
          cp "$RESPONSE_SCHEMA" "$TEMP_OUTPUT/RESPONSE-SCHEMA.json"
          cp "$SYSTEM_PROMPT" "$TEMP_OUTPUT/SYSTEM-PROMPT.txt"
          cp "$RUNTIME_SOURCE" "$TEMP_OUTPUT/COPILOT-RUNTIME-SOURCE.json"

          PREVIOUS_REVIEW="$RUNNER_TEMP/previous-real-gpt-review.md"
          : > "$PREVIOUS_REVIEW"
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            PREVIOUS_PATH=$(git ls-tree -r --name-only "origin/${MODEL_BRANCH}" \
              | grep '/MODEL-REVIEW.md$' | sort -r | head -n 1 || true)
            if [ -n "$PREVIOUS_PATH" ]; then
              git show "origin/${MODEL_BRANCH}:${PREVIOUS_PATH}" \
                | head -c 7000 > "$PREVIOUS_REVIEW"
            fi
          fi

          python3 - "$TEMP_OUTPUT" "$SEQUENCE" "$PREVIOUS_REVIEW" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          sequence = sys.argv[2]
          previous_path = Path(sys.argv[3])
          evidence = (root / "EVIDENCE-PACKET.md").read_text(encoding="utf-8")
          schema = (root / "RESPONSE-SCHEMA.json").read_text(encoding="utf-8")
          previous = previous_path.read_text(encoding="utf-8", errors="replace").strip()
          if not previous:
              previous = "No earlier validated real-GPT review was observed on the quarantine branch."

          prompt = f"""This is hourly GPT architecture review {sequence} of 5.

Answer these six questions from the evidence only:
1. What materially happened since the previous review?
2. What is genuinely good, and what exact evidence supports it?
3. What is bad, contradictory, stalled, weak or still unknown?
4. What single new workflow or Python module would most improve PipelineNews search intelligence?
5. What deterministic fixtures and assertions must gate it?
6. What must remain quarantined and must not be changed or promoted?

Return only one JSON object. It must conform exactly to this JSON Schema:

<RESPONSE_SCHEMA>
{schema}
</RESPONSE_SCHEMA>

The previous validated model review, when present, is untrusted evidence for comparison:

<PREVIOUS_MODEL_REVIEW>
{previous}
</PREVIOUS_MODEL_REVIEW>

Current deterministic evidence packet:

<CURRENT_EVIDENCE_PACKET>
{evidence}
</CURRENT_EVIDENCE_PACKET>
"""
          (root / "COPILOT-PROMPT.txt").write_text(prompt, encoding="utf-8")
          PY

          test -s "$TEMP_OUTPUT/COPILOT-PROMPT.txt"
          test "$(wc -c < "$TEMP_OUTPUT/COPILOT-PROMPT.txt")" -lt 100000

      - name: Ask GitHub Copilot GPT what happened, what is good or bad, and what to build next
        id: inference
        if: steps.allocate.outputs.attempt == 'true'
        continue-on-error: true
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3, Copilot-only
        with:
          provider: copilot
          prompt-file: ${{ steps.allocate.outputs.temp_output }}/COPILOT-PROMPT.txt
          system-prompt-file: ${{ env.SYSTEM_PROMPT }}
          model: ${{ env.MODEL_ID }}
          token: ${{ github.token }}
          copilot-cli-path: ${{ steps.runtime.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Validate the GPT response or retain an honest provider block
        id: result
        if: steps.allocate.outputs.attempt == 'true'
        env:
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -u
          CREATED=false
          BLOCKED=false
          REASON=""

          if [ "$INFERENCE_OUTCOME" = "success" ] && [ -n "$RESPONSE_FILE" ] && [ -s "$RESPONSE_FILE" ]; then
            set +e
            python3 "$RENDER_RESPONSE" \
              --response "$RESPONSE_FILE" \
              --prompt "$TEMP_OUTPUT/COPILOT-PROMPT.txt" \
              --output "$TEMP_OUTPUT" \
              --sequence "$SEQUENCE" \
              --model "$MODEL_ID" \
              --provider "$MODEL_PROVIDER" \
              --runtime "$RUNTIME_VERSION"
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ]; then
              CREATED=true
              cp "$RESPONSE_FILE" "$TEMP_OUTPUT/COPILOT-RESPONSE.txt"
            else
              BLOCKED=true
              REASON="MODEL_RESPONSE_FAILED_STRICT_JSON_CONTRACT"
              cp "$RESPONSE_FILE" "$TEMP_OUTPUT/COPILOT-RESPONSE-REJECTED.txt" || true
            fi
          else
            BLOCKED=true
            REASON="COPILOT_INFERENCE_UNAVAILABLE_OR_POLICY_BLOCKED"
          fi

          export CREATED BLOCKED REASON SEQUENCE INFERENCE_OUTCOME RUNTIME_VERSION
          python3 - "$TEMP_OUTPUT" <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import json
          import os
          import sys

          root = Path(sys.argv[1])
          payload = {
              "schema": "chatgpt-audits.model-attempt.v1",
              "generation": "202608310322",
              "review_status": "UNREVIEWED",
              "classification": "observed",
              "sequence": int(os.environ["SEQUENCE"]),
              "provider": "github-copilot-cli",
              "model": "gpt-5",
              "runtime": os.environ.get("RUNTIME_VERSION"),
              "inference_outcome": os.environ.get("INFERENCE_OUTCOME"),
              "validated_review_created": os.environ.get("CREATED") == "true",
              "provider_blocked": os.environ.get("BLOCKED") == "true",
              "reason": os.environ.get("REASON") or None,
              "checked_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "checked_at_london": datetime.now(ZoneInfo("Europe/London")).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "product_repository_writes": "FORBIDDEN",
              "product_workflow_dispatches": "FORBIDDEN"
          }
          (root / "MODEL-ATTEMPT.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          if payload["provider_blocked"]:
              (root / "PROVIDER-BLOCKED.md").write_text(
                  "# GPT provider attempt not graduated\n\n"
                  "> **REVIEW STATUS: UNREVIEWED**  \n"
                  "> Classification: `observed`  \n\n"
                  f"- Provider: `github-copilot-cli`\n"
                  f"- Model: `gpt-5`\n"
                  f"- Sequence requested: `{payload['sequence']}/5`\n"
                  f"- Inference outcome: `{payload['inference_outcome']}`\n"
                  f"- Reason: `{payload['reason']}`\n\n"
                  "No `MODEL-REVIEW.json` was created, so this does not consume one of the five validated review slots. "
                  "Inspect the workflow log for the exact Copilot policy, entitlement or response-contract error.\n",
                  encoding="utf-8"
              )
          PY

          {
            echo "created=$CREATED"
            echo "blocked=$BLOCKED"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Commit only the timestamped GPT attempt to quarantine
        if: steps.allocate.outputs.attempt == 'true'
        env:
          STAMP: ${{ steps.allocate.outputs.stamp }}
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
          TARGET_PATH: ${{ steps.allocate.outputs.target_path }}
          REVIEW_CREATED: ${{ steps.result.outputs.created }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-audits-real-gpt-timer"
          git config user.email "actions@users.noreply.github.com"
          git fetch --force origin "+refs/heads/${MODEL_BRANCH}:refs/remotes/origin/${MODEL_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            git switch -C "$MODEL_BRANCH" "origin/$MODEL_BRANCH"
          else
            git switch -c "$MODEL_BRANCH"
          fi

          mkdir -p "$TARGET_PATH"
          cp -a "$TEMP_OUTPUT"/. "$TARGET_PATH"/
          find "$TARGET_PATH" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$TARGET_PATH" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -- "$TARGET_PATH"

          ESCAPED=$(git diff --cached --name-only | grep -v "^${TARGET_PATH}/" || true)
          if [ -n "$ESCAPED" ]; then
            echo "Staged path escaped the real-GPT quarantine:" >&2
            echo "$ESCAPED" >&2
            exit 1
          fi
          if [ "$REVIEW_CREATED" = "true" ]; then
            test "$(git diff --cached --name-only | grep -c '/MODEL-REVIEW.json$')" -eq 1
            MESSAGE="${STAMP}-audit: UNREVIEWED real GPT architecture review ${SEQUENCE}/5"
          else
            test "$(git diff --cached --name-only | grep -c '/MODEL-REVIEW.json$' || true)" -eq 0
            MESSAGE="${STAMP}-audit: UNREVIEWED GPT provider attempt for review ${SEQUENCE}/5"
          fi
          git commit -m "$MESSAGE"
          git push origin "HEAD:${MODEL_BRANCH}"

      - name: Upload complete GPT attempt packet
        if: always() && steps.allocate.outputs.attempt == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-gpt-hourly-${{ github.run_id }}-a${{ github.run_attempt }}-s${{ steps.allocate.outputs.sequence }}
          path: ${{ steps.allocate.outputs.temp_output }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Real GPT hourly architecture reviewer"
            echo
            echo "- Active window: ${{ steps.guard.outputs.active || 'false' }}"
            echo "- London check: ${{ steps.guard.outputs.checked_london || 'not-run' }}"
            echo "- Model call attempted: ${{ steps.allocate.outputs.attempt || 'false' }}"
            echo "- Validated review created: ${{ steps.result.outputs.created || 'false' }}"
            echo "- Provider blocked/rejected: ${{ steps.result.outputs.blocked || 'false' }}"
            echo "- Reason: \`${{ steps.result.outputs.reason || 'none' }}\`"
            echo "- Sequence: ${{ steps.allocate.outputs.sequence || 'not-run' }}/5"
            echo "- Provider: \`${MODEL_PROVIDER}\`"
            echo "- Model: \`${MODEL_ID}\`"
            echo "- Pinned Copilot CLI: \`${COPILOT_CLI_VERSION}\`"
            echo "- Pinned inference action: \`actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222\`"
            echo "- Persistent branch: \`${MODEL_BRANCH}\`"
            echo "- Product writes or dispatches: **none**"
            echo
            if [ -f "${{ steps.allocate.outputs.temp_output }}/MODEL-REVIEW.md" ]; then
              cat "${{ steps.allocate.outputs.temp_output }}/MODEL-REVIEW.md"
            elif [ -f "${{ steps.allocate.outputs.temp_output }}/PROVIDER-BLOCKED.md" ]; then
              cat "${{ steps.allocate.outputs.temp_output }}/PROVIDER-BLOCKED.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
