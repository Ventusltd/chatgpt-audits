name: 202608310322 real GPT hourly architecture reviewer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/202608310322-real-gpt-hourly-review.yml
      - automation/202608310322-gpt-reasoning-timer/**
  workflow_dispatch:
  schedule:
    - cron: '34 3-6 31 8 *'

permissions:
  actions: read
  contents: write
  copilot-requests: write

concurrency:
  group: 202608310322-real-gpt-hourly-architecture-reviewer
  cancel-in-progress: false

env:
  ROOT: automation/202608310322-gpt-reasoning-timer
  BUILD_EVIDENCE: automation/202608310322-gpt-reasoning-timer/build_prompt.py
  ASSEMBLE_PROMPT: automation/202608310322-gpt-reasoning-timer/assemble_prompt.py
  RUN_COPILOT: automation/202608310322-gpt-reasoning-timer/run_copilot.py
  RENDER_RESPONSE: automation/202608310322-gpt-reasoning-timer/render_response.py
  RECORD_ATTEMPT: automation/202608310322-gpt-reasoning-timer/record_attempt.py
  SELF_TEST: automation/202608310322-gpt-reasoning-timer/self_test.py
  RESPONSE_SCHEMA: automation/202608310322-gpt-reasoning-timer/response-schema.json
  SYSTEM_PROMPT: automation/202608310322-gpt-reasoning-timer/copilot-system.txt
  RUNTIME_SOURCE: automation/202608310322-gpt-reasoning-timer/copilot-runtime-source.json
  MODEL_PROVIDER: github-copilot-cli-direct
  MODEL_ID: gpt-4.1
  COPILOT_CLI_VERSION: 1.0.82
  MODEL_BRANCH: audit/202608310322-real-gpt-hourly-review
  GITHUB_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reason:
    if: github.repository == 'Ventusltd/chatgpt-audits'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact current audit main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Enforce the bounded five-run window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          NOW=$(TZ=Europe/London date +%Y%m%d%H%M)
          ACTIVE=false
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch)
              if [[ "$NOW" > "202608310319" && "$NOW" < "202608310801" ]]; then ACTIVE=true; fi
              ;;
            schedule)
              if [[ "$NOW" > "202608310419" && "$NOW" < "202608310801" ]]; then ACTIVE=true; fi
              ;;
          esac
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "checked_london=$NOW" >> "$GITHUB_OUTPUT"
          if [ "$ACTIVE" != "true" ]; then
            echo "Outside the bounded five-run model-review window; inert by design."
          fi

      - name: Run deterministic controller tests
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$ROOT"/*.py
          find "$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          python3 "$SELF_TEST" \
            --renderer "$RENDER_RESPONSE" \
            --assembler "$ASSEMBLE_PROMPT" \
            --recorder "$RECORD_ATTEMPT" \
            --schema "$RESPONSE_SCHEMA" \
            --runtime-source "$RUNTIME_SOURCE"

      - name: Install source-carded Copilot CLI runtime
        id: runtime
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_ROOT="$RUNNER_TEMP/copilot-cli-${COPILOT_CLI_VERSION}"
          ARCHIVE="$RUNNER_TEMP/copilot-linux-x64-${COPILOT_CLI_VERSION}.tar.gz"
          URL=$(python3 -c "import json; print(json.load(open('$RUNTIME_SOURCE'))['asset_url'])")
          EXPECTED=$(python3 -c "import json; print(json.load(open('$RUNTIME_SOURCE'))['sha256'])")
          rm -rf "$RUNTIME_ROOT" "$ARCHIVE"
          mkdir -p "$RUNTIME_ROOT"
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "$URL" --output "$ARCHIVE"
          echo "$EXPECTED  $ARCHIVE" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" -C "$RUNTIME_ROOT"
          COPILOT_PATH=$(find "$RUNTIME_ROOT" -type f -name copilot -print -quit)
          test -n "$COPILOT_PATH"
          chmod 0555 "$COPILOT_PATH"
          ACTUAL_VERSION=$($COPILOT_PATH --version | head -n 1 | tr -d '\r')
          echo "Pinned runtime reports: $ACTUAL_VERSION"
          echo "path=$COPILOT_PATH" >> "$GITHUB_OUTPUT"
          echo "version=$ACTUAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Allocate one of exactly five validated review slots
        id: allocate
        if: steps.guard.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/heads/${MODEL_BRANCH}:refs/remotes/origin/${MODEL_BRANCH}" || true
          COUNT=0
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            COUNT=$(git ls-tree -r --name-only "origin/${MODEL_BRANCH}" | grep -c '/MODEL-REVIEW.json$' || true)
          fi
          if [ "$COUNT" -ge 5 ]; then
            echo "attempt=false" >> "$GITHUB_OUTPUT"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "sequence=5" >> "$GITHUB_OUTPUT"
            echo "Five validated GPT reviews already exist; no sixth model call will be made."
            exit 0
          fi
          SEQUENCE=$((COUNT + 1))
          STAMP=$(TZ=Europe/London date +%Y%m%d%H%M)
          TEMP_OUTPUT="$RUNNER_TEMP/real-gpt-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-s${SEQUENCE}"
          TARGET_PATH="202608310033-study/REAL-GPT-TIMER/${STAMP}-run-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-review-${SEQUENCE}"
          rm -rf "$TEMP_OUTPUT"
          mkdir -p "$TEMP_OUTPUT"
          echo "attempt=true" >> "$GITHUB_OUTPUT"
          echo "complete=false" >> "$GITHUB_OUTPUT"
          echo "sequence=$SEQUENCE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "temp_output=$TEMP_OUTPUT" >> "$GITHUB_OUTPUT"
          echo "target_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"

      - name: Build bounded evidence and prompt
        if: steps.allocate.outputs.attempt == 'true'
        env:
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$BUILD_EVIDENCE" --sequence "$SEQUENCE" --output "$TEMP_OUTPUT"
          cp "$RESPONSE_SCHEMA" "$TEMP_OUTPUT/RESPONSE-SCHEMA.json"
          cp "$SYSTEM_PROMPT" "$TEMP_OUTPUT/SYSTEM-PROMPT.txt"
          cp "$RUNTIME_SOURCE" "$TEMP_OUTPUT/COPILOT-RUNTIME-SOURCE.json"
          PREVIOUS="$RUNNER_TEMP/previous-real-gpt-review.md"
          : > "$PREVIOUS"
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            PREVIOUS_PATH=$(git ls-tree -r --name-only "origin/${MODEL_BRANCH}" | grep '/MODEL-REVIEW.md$' | sort -r | head -n 1 || true)
            if [ -n "$PREVIOUS_PATH" ]; then
              git show "origin/${MODEL_BRANCH}:${PREVIOUS_PATH}" | head -c 7000 > "$PREVIOUS"
            fi
          fi
          python3 "$ASSEMBLE_PROMPT" \
            --sequence "$SEQUENCE" \
            --evidence "$TEMP_OUTPUT/EVIDENCE-PACKET.md" \
            --schema "$TEMP_OUTPUT/RESPONSE-SCHEMA.json" \
            --previous "$PREVIOUS" \
            --output "$TEMP_OUTPUT/COPILOT-PROMPT.txt"
          test -s "$TEMP_OUTPUT/COPILOT-PROMPT.txt"

      - name: Ask GPT directly through isolated Copilot CLI and retain exact stderr
        id: inference
        if: steps.allocate.outputs.attempt == 'true'
        env:
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
          COPILOT_PATH: ${{ steps.runtime.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUN_COPILOT" \
            --cli "$COPILOT_PATH" \
            --prompt "$TEMP_OUTPUT/COPILOT-PROMPT.txt" \
            --system "$SYSTEM_PROMPT" \
            --output "$TEMP_OUTPUT" \
            --model "$MODEL_ID" \
            --timeout-seconds 240
          OUTCOME=$(python3 -c "import json; print(json.load(open('$TEMP_OUTPUT/COPILOT-RUN.json'))['outcome'])")
          REASON=$(python3 -c "import json; print(json.load(open('$TEMP_OUTPUT/COPILOT-RUN.json'))['reason'])")
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "response_file=$TEMP_OUTPUT/COPILOT-RESPONSE.txt" >> "$GITHUB_OUTPUT"
          echo "stderr_file=$TEMP_OUTPUT/COPILOT-STDERR.txt" >> "$GITHUB_OUTPUT"
          rm -rf "$TEMP_OUTPUT/copilot-isolated-runtime"

      - name: Validate response or retain provider block
        id: result
        if: steps.allocate.outputs.attempt == 'true'
        env:
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
          RESPONSE_FILE: ${{ steps.inference.outputs.response_file }}
          INFERENCE_OUTCOME: ${{ steps.inference.outputs.outcome }}
          INFERENCE_REASON: ${{ steps.inference.outputs.reason }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -u
          CREATED=false
          REASON="$INFERENCE_REASON"
          if [ "$INFERENCE_OUTCOME" = success ] && [ -n "$RESPONSE_FILE" ] && [ -s "$RESPONSE_FILE" ]; then
            set +e
            python3 "$RENDER_RESPONSE" \
              --response "$RESPONSE_FILE" \
              --prompt "$TEMP_OUTPUT/COPILOT-PROMPT.txt" \
              --output "$TEMP_OUTPUT" \
              --sequence "$SEQUENCE" \
              --model "$MODEL_ID" \
              --provider "$MODEL_PROVIDER" \
              --runtime "$RUNTIME_VERSION"
            CODE=$?
            set -e
            if [ "$CODE" -eq 0 ]; then
              CREATED=true
              REASON=
            else
              REASON=MODEL_RESPONSE_FAILED_STRICT_JSON_CONTRACT
              cp "$RESPONSE_FILE" "$TEMP_OUTPUT/COPILOT-RESPONSE-REJECTED.txt" || true
            fi
          fi
          python3 "$RECORD_ATTEMPT" \
            --output "$TEMP_OUTPUT" \
            --sequence "$SEQUENCE" \
            --provider "$MODEL_PROVIDER" \
            --model "$MODEL_ID" \
            --runtime "$RUNTIME_VERSION" \
            --inference-outcome "$INFERENCE_OUTCOME" \
            --created "$CREATED" \
            --reason "$REASON"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"
          echo "blocked=$([ "$CREATED" = true ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON:-none}" >> "$GITHUB_OUTPUT"

      - name: Commit only the timestamped GPT attempt to quarantine
        if: steps.allocate.outputs.attempt == 'true'
        env:
          STAMP: ${{ steps.allocate.outputs.stamp }}
          SEQUENCE: ${{ steps.allocate.outputs.sequence }}
          TEMP_OUTPUT: ${{ steps.allocate.outputs.temp_output }}
          TARGET_PATH: ${{ steps.allocate.outputs.target_path }}
          REVIEW_CREATED: ${{ steps.result.outputs.created }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name chatgpt-audits-real-gpt-timer
          git config user.email actions@users.noreply.github.com
          git fetch --force origin "+refs/heads/${MODEL_BRANCH}:refs/remotes/origin/${MODEL_BRANCH}" || true
          if git show-ref --verify --quiet "refs/remotes/origin/${MODEL_BRANCH}"; then
            git switch -C "$MODEL_BRANCH" "origin/$MODEL_BRANCH"
          else
            git switch -c "$MODEL_BRANCH"
          fi
          mkdir -p "$TARGET_PATH"
          cp -a "$TEMP_OUTPUT"/. "$TARGET_PATH"/
          find "$TARGET_PATH" -type d -name __pycache__ -prune -exec rm -rf {} + || true
          find "$TARGET_PATH" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git add -- "$TARGET_PATH"
          ESCAPED=$(git diff --cached --name-only | grep -v "^${TARGET_PATH}/" || true)
          test -z "$ESCAPED"
          if [ "$REVIEW_CREATED" = true ]; then
            test "$(git diff --cached --name-only | grep -c '/MODEL-REVIEW.json$')" -eq 1
            MESSAGE="${STAMP}-audit: UNREVIEWED real GPT architecture review ${SEQUENCE}/5"
          else
            test "$(git diff --cached --name-only | grep -c '/MODEL-REVIEW.json$' || true)" -eq 0
            MESSAGE="${STAMP}-audit: UNREVIEWED GPT provider attempt for review ${SEQUENCE}/5"
          fi
          git commit -m "$MESSAGE"
          git push origin "HEAD:${MODEL_BRANCH}"

      - name: Upload complete GPT attempt packet
        if: always() && steps.allocate.outputs.attempt == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-gpt-hourly-${{ github.run_id }}-a${{ github.run_attempt }}-s${{ steps.allocate.outputs.sequence }}
          path: ${{ steps.allocate.outputs.temp_output }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish operator summary
        if: always()
        shell: bash
        run: |
          echo "# Real GPT hourly architecture reviewer" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Active window: ${{ steps.guard.outputs.active || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- London check: ${{ steps.guard.outputs.checked_london || 'not-run' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model call attempted: ${{ steps.allocate.outputs.attempt || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validated review created: ${{ steps.result.outputs.created || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider blocked/rejected: ${{ steps.result.outputs.blocked || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: \`${{ steps.result.outputs.reason || 'none' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sequence: ${{ steps.allocate.outputs.sequence || 'not-run' }}/5" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider/model: \`${MODEL_PROVIDER}/${MODEL_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Copilot CLI: \`${COPILOT_CLI_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Persistent branch: \`${MODEL_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Product writes or dispatches: **none**" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${{ steps.allocate.outputs.temp_output }}/MODEL-REVIEW.md" ]; then
            cat "${{ steps.allocate.outputs.temp_output }}/MODEL-REVIEW.md" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "${{ steps.allocate.outputs.temp_output }}/PROVIDER-BLOCKED.md" ]; then
            cat "${{ steps.allocate.outputs.temp_output }}/PROVIDER-BLOCKED.md" >> "$GITHUB_STEP_SUMMARY"
          fi
